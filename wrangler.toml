name = "cloudflare-rdp-gateway"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Fill in your account_id before publishing
# account_id = "your_account_id_here"

# Deploy static site assets from the frontend/ directory so Wrangler can detect static files
[site]
bucket = "frontend"

# Deploy to workers.dev during testing. Set to false and add routes for custom domain deploy.
workers_dev = true

[build]
command = ""

[durable_objects]
bindings = [
  { name = "RDP_BRIDGE", class_name = "RDPBridge" }
]

[exports.RDPBridge]
type = "durable-object"
storage = "sqlite"

[triggers]
# routes = ["yourdomain.com/bridge*"]
