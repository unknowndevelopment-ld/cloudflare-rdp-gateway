name = "cloudflare-proxy"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Set your Cloudflare account id before publishing
# account_id = "<YOUR_ACCOUNT_ID>"

workers_dev = true

[vars]
# Optionally configured comma-separated allowlist of hostnames (e.g. "example.com,example.org"). If empty, all hosts are allowed.
# ALLOWLIST_HOSTS = ""

# PROXY_TOKEN should be set as a secret in your account. For local testing you can set it here but DO NOT commit secrets.
# PROXY_TOKEN = "change-me"
