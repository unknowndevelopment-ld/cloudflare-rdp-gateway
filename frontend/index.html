<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloudflare RDP Gateway — Demo Frontend</title>
  <style>body{font-family:system-ui,Segoe UI,Helvetica,Arial;margin:2rem} label,input{display:block;margin:0.25rem 0} #log{white-space:pre-wrap;background:#111;color:#0f0;padding:1rem;height:200px;overflow:auto}</style>
</head>
<body>
  <h1>cloudflare-rdp-gateway — demo frontend</h1>
  <p>This is a minimal demo frontend. It does NOT include an RDP client. You must provide a WASM-enabled RDP client (e.g., a FreeRDP build to WASM) or use a server-side translator like Apache Guacamole.</p>

  <label>RDP host (IP or hostname): <input id="host" value="127.0.0.1"></label>
  <label>RDP port: <input id="port" value="3389"></label>
  <label>Session name (optional): <input id="session" placeholder="session-id"></label>
  <button id="connect">Open WebSocket → Worker bridge</button>

  <h2>Log</h2>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(...args){ logEl.textContent += args.join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight }

    document.getElementById('connect').addEventListener('click', async ()=>{
      const host = document.getElementById('host').value;
      const port = document.getElementById('port').value || '3389';
      const session = document.getElementById('session').value || '';

      // The Worker route: /bridge?host=...&port=...&session=...
      // Configure your Cloudflare worker route or a Pages Worker route to forward /bridge to the Worker.
      const params = new URLSearchParams({ host, port });
      if(session) params.set('session', session);
      const url = `${location.origin.replace(/^http/, 'ws')}/bridge?${params.toString()}`;

      log('connecting to', url);
      try{
        const ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';
        ws.onopen = ()=> log('websocket open');
        ws.onmessage = ev => {
          log('received', ev.data instanceof ArrayBuffer ? `ArrayBuffer ${ev.data.byteLength} bytes` : ev.data);
          // TODO: pass bytes to your WASM RDP client (decode, render)
        };
        ws.onclose = ev => log('ws closed', ev.code, ev.reason);
        ws.onerror = e => log('ws error', e.message || e);

        // Demo: send a small ping every 5s to keep connection active
        setInterval(()=>{
          if(ws.readyState === WebSocket.OPEN){ ws.send('ping'); log('sent ping') }
        }, 5000);

      }catch(e){ log('connect error', e.message || e) }
    })
  </script>
</body>
</html>
